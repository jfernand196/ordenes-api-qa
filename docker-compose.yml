services:
  api:
    build: ./backend
    image: challenge-api
    ports:
      - "8080:8080"
    environment:
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build: ./frontend
    image: challenge-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
